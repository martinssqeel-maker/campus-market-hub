<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Campus Marketplace logo">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b5b55"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#brand)"/>

  <!-- graduation cap = campus -->
  <path d="M64 30 L104 48 L64 66 L24 48 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M40 55 L40 74 C40 82 52 88 64 88 C76 88 88 82 88 74 L88 55 L64 66 Z" fill="#ffffff" opacity="0.72"/>
  <path d="M104 48 L104 74" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="104" cy="79" r="6" fill="url(#gold)"/>

  <!-- price tag = marketplace -->
  <g transform="translate(70 78) rotate(-12)">
    <rect x="0" y="0" width="42" height="26" rx="8" fill="url(#gold)"/>
    <circle cx="10" cy="13" r="4" fill="#0b5b55"/>
    <rect x="19" y="8" width="17" height="4" rx="2" fill="#0b5b55" opacity="0.85"/>
    <rect x="19" y="15" width="12" height="4" rx="2" fill="#0b5b55" opacity="0.6"/>
  </g>
</svg>
