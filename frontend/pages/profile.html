<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Your Campus Marketplace dashboard – your listings, favourites, reviews and reputation.">
  <title>My dashboard · Campus Marketplace</title>

  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="profile">

  <div class="user-dashboard">

    <!-- Compact glass top bar -->
    <header class="dash-topbar">
      <a class="dash-brand-link" href="../index.html" style="flex:0 0 auto">
        <span class="dash-brand-logo" aria-hidden="true">CM</span>
        <span class="dash-brand-text">
          <strong>Campus Market</strong>
          <small>My dashboard</small>
        </span>
      </a>

      <span class="dash-topbar-spacer"></span>

      <div class="dash-topbar-actions" id="ud-topbar-actions"></div>
    </header>

    <div class="ud-content">
      <!-- Profile card, tabs and grids are rendered by marketplace.js -->
      <div id="profile-root">
        <div class="dash-skeleton" style="height:280px"></div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/marketplace.js"></script>
</body>
</html>
