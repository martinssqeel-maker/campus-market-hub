<!DOCTYPE html>
<html lang="en" data-zone="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b8371">
  <title>Saved items · Lafia Marketplace</title>
  <meta name="description" content="Items, rooms, events and services you saved for later on Lafia Marketplace.">

  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/premium.css">

  <script src="../js/shell.js"></script>
</head>
<body data-page="favorites">

  <header id="site-header"></header>

  <main>
    <div class="page-head">
      <div class="container page-head__inner">
        <div>
          <span class="mk-kicker">Saved</span>
          <h1>Your wishlist</h1>
          <p>Items, rooms, events and services you saved for later</p>
        </div>
        <div class="page-head__actions">
          <a class="btn btn-outline" href="home.html">Continue browsing</a>
        </div>
      </div>
    </div>

    <div class="container" style="padding-bottom:var(--sp-10)">
      <div class="chip-row mb-3" id="favorite-chips">
        <button class="chip active" data-value="all" type="button">All saved</button>
        <button class="chip" data-value="product" type="button">Items</button>
        <button class="chip" data-value="accommodation" type="button">Rooms</button>
        <button class="chip" data-value="event" type="button">Events</button>
        <button class="chip" data-value="service" type="button">Services</button>
      </div>

      <h2 class="h3 mt-4">Saved listings</h2>
      <div id="favorites-root">
        <div class="grid grid-cards">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </div>
  </main>

  <nav id="bottom-nav" aria-label="App navigation"></nav>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/engage.js"></script>
  <script src="../js/marketplace.js"></script>
</body>
</html>
