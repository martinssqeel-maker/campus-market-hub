<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Your saved listings and wishlist on Campus Marketplace.">
  <title>My wishlist · Campus Marketplace</title>

  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="favorites">

  <header id="site-header"></header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <h1 class="mb-0">My wishlist</h1>
            <p class="mb-0">Items, rooms, events and services you saved for later</p>
          </div>
          <a class="btn btn-outline btn-sm" href="home.html">Back Continue browsing</a>
        </div>

        <div class="chip-row mb-3" id="favorite-chips">
          <button class="chip active" data-value="all">All saved</button>
          <button class="chip" data-value="product">Products Products</button>
          <button class="chip" data-value="accommodation">Rooms Rooms</button>
          <button class="chip" data-value="event">Events Events</button>
          <button class="chip" data-value="service">Services Services</button>
        </div>

        <div id="favorites-root">
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <nav id="bottom-nav" aria-label="Mobile navigation"></nav>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/marketplace.js"></script>
</body>
</html>
