<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find student rooms, hostels and self-contained accommodation around Lafia."><meta name="api-base" content="/api"><meta name="theme-color" content="#176c57">
  <title>Accommodation — Campus Marketplace</title><link rel="icon" type="image/svg+xml" href="/assets/images/campus-logo.svg"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/api.js" defer></script><script src="/js/marketplace.js" defer></script><script src="/js/auth.js" defer></script><script src="/js/admin.js" defer></script>
</head>
<body data-page="accommodation"><div id="site-header"></div>
  <main class="page-main page-main--soft"><div class="container">
    <div class="page-intro"><span class="eyebrow">Room to settle in</span><h1>Your next place starts here.</h1><p>Explore student-friendly rooms around FULafia and connect with the landlord directly.</p></div>
    <form class="filters-panel" id="accommodation-filters">
      <div class="filter-field filter-search"><label for="accom-q">Search accommodation</label><input id="accom-q" name="q" type="search" placeholder="Search a neighbourhood or feature"></div>
      <div class="filter-field"><label for="accom-type">Room type</label><select id="accom-type" name="room_type"><option value="">Any type</option><option value="room">Single room</option><option value="shared">Shared apartment</option><option value="self_contain">Self-contain</option><option value="hostel">Hostel</option></select></div>
      <div class="filter-field"><label for="accom-min">Min rent (₦)</label><input id="accom-min" name="min_price" type="number" min="0" step="1000" placeholder="0"></div>
      <div class="filter-field"><label for="accom-max">Max rent (₦)</label><input id="accom-max" name="max_price" type="number" min="0" step="1000" placeholder="Any"></div>
      <div class="filter-field"><label for="accom-location">Location</label><input id="accom-location" name="location" type="search" placeholder="Take-off, Lafia…"></div>
      <button class="btn btn-primary filter-submit" type="submit">Find a room</button>
    </form>
    <div class="results-bar"><span data-results-count>Loading accommodation…</span><a class="text-link" href="/pages/post-listing.html?type=accommodation">List a room</a></div>
    <div class="card-grid card-grid--three" data-accommodation-grid data-page-size="12" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="pagination" data-pagination aria-label="Accommodation pages"></div>
  </div></main><div id="site-footer"></div><div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
