<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to Campus Marketplace."><meta name="api-base" content="/api"><meta name="theme-color" content="#176c57">
  <title>Sign in — Campus Marketplace</title><link rel="icon" type="image/svg+xml" href="/assets/images/campus-logo.svg"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/api.js" defer></script><script src="/js/marketplace.js" defer></script><script src="/js/auth.js" defer></script><script src="/js/admin.js" defer></script>
</head>
<body data-page="login"><div id="site-header"></div>
  <main class="auth-layout">
    <aside class="auth-art"><div class="auth-art-content"><img src="/assets/images/campus-hero.svg" alt=""><span class="eyebrow">Your campus, closer</span><h2>A better way to find your people.</h2><p>Pick up where student life happens: with useful listings and real campus connections.</p></div></aside>
    <section class="auth-panel"><div class="auth-card">
      <span class="eyebrow">Welcome back</span><h1>Sign in to your account</h1><p>Good to see you again. Your campus marketplace is waiting.</p>
      <div class="form-alert" data-form-alert role="alert"></div>
      <form class="form-stack" id="login-form" novalidate>
        <div class="form-field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></div>
        <div class="form-field"><label for="login-password">Password</label><div class="input-with-icon"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Show password" data-toggle-password="login-password">◉</button></div></div>
        <div class="form-options"><label class="check-row"><input type="checkbox" name="remember" checked><span>Keep me signed in on this device</span></label><span class="small">JWT session</span></div>
        <button class="btn btn-primary btn-large btn-full" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="form-note">New to Campus Marketplace? <a href="/pages/signup.html">Create an account</a></p>
    </div></section>
  </main><div id="site-footer"></div><div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
