<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse approved student listings at Federal University of Lafia."><meta name="api-base" content="/api">
  <meta name="theme-color" content="#176c57"><title>Marketplace — Campus Marketplace</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/campus-logo.svg"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/api.js" defer></script><script src="/js/marketplace.js" defer></script><script src="/js/auth.js" defer></script><script src="/js/admin.js" defer></script>
</head>
<body data-page="products">
  <div id="site-header"></div>
  <main class="page-main page-main--soft"><div class="container">
    <div class="page-intro"><span class="eyebrow">Student marketplace</span><h1>Find your next good thing.</h1><p>Buy and sell with students around Federal University of Lafia. Every listing is checked before it goes live.</p></div>
    <form class="filters-panel" id="product-filters">
      <div class="filter-field filter-search"><label for="product-q">Search</label><input id="product-q" name="q" type="search" placeholder="Try books, calculator, furniture…"></div>
      <div class="filter-field"><label for="product-category">Category</label><select id="product-category" name="category"><option value="">All categories</option><option>Books</option><option>Electronics</option><option>Fashion</option><option>Home &amp; living</option><option>Food</option><option>Other</option></select></div>
      <div class="filter-field"><label for="product-min">Min price (₦)</label><input id="product-min" name="min_price" type="number" min="0" step="100" placeholder="0"></div>
      <div class="filter-field"><label for="product-max">Max price (₦)</label><input id="product-max" name="max_price" type="number" min="0" step="100" placeholder="Any"></div>
      <div class="filter-field"><label for="product-location">Location</label><input id="product-location" name="location" type="search" placeholder="Campus / Lafia"></div>
      <div class="filter-field"><label for="product-sort">Sort by</label><select id="product-sort" name="sort"><option value="newest">Newest</option><option value="price_low">Price: low to high</option><option value="price_high">Price: high to low</option></select></div>
      <button class="btn btn-primary filter-submit" type="submit">Search listings</button>
    </form>
    <div class="results-bar"><span data-results-count>Loading listings…</span><a class="text-link" href="/pages/post-listing.html">＋ Sell something</a></div>
    <div class="card-grid" data-product-grid data-page-size="12" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="pagination" data-pagination aria-label="Marketplace pages"></div>
  </div></main>
  <div id="site-footer"></div><div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
